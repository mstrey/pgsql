networks:
  backend:
    external: true
  frontend:
    external: true

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/postgres_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-web:
    image: libredb/libredb-studio:latest
    container_name: postgres-web
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      - ALLOW_CUSTOM_CONNECTIONS=true
      - REQUIRE_AUTH=true 
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/db/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.postgres-web.rule=Host(`${SERVICE}.${DOMAIN}`)"
      - "traefik.http.routers.postgres-web.entrypoints=web"
      - "traefik.http.services.postgres-web.loadbalancer.server.port=3000"